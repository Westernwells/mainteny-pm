events {}

http {
    include mime.types;
    server {
        listen 80;
        
        location ^~ /pm {
            alias /usr/share/nginx/html;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;
        }

        location = /healthz {
            return 200 '{"status":"UP"}';
            add_header Content-Type text/json;
        }
    }
}
