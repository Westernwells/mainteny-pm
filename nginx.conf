events {}

http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /pm {
            try_files $uri $uri/ /index.html;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;
        }

        location = /healthz {
            return 200 '{"status":"UP"}';
            add_header Content-Type text/json;
        }
    }
}
