stages:
  - lint
  - build-project
  - build-images
  - deploy

.build-project: &build-template
  stage: build-project
  image: node:lts-gallium
  script:
    - yarn prepare
    - yarn install --frozen-lockfile
    - yarn build:${ENV}

build-staging:
  << : *build-template
  variables:
    ENV: staging
  rules:
    - when: on_success

build-prod:
  << : *build-template
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
      when: on_success
      variables:
        ENV: prod
    - when: never
